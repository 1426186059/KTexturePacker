<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多文件夹处理 · KTexturePacker</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #20242e;
      --accent: #5b8cff;
      --accent-2: #3f6fe0;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--panel);
    }
    header h1 { font-size: 18px; margin: 0; }
    header .subtitle { color: var(--muted); font-size: 13px; }
    nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 14px;
      padding: 7px 16px; border-radius: 8px; border: 1px solid transparent;
      white-space: nowrap; transition: background .15s, color .15s;
    }
    nav a:hover { color: var(--text); background: var(--panel-2); }
    nav a.active { color: #fff; background: var(--accent); }

    .topbar { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .topbar-inner { max-width: 1280px; margin: 0 auto; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .field-row { grid-template-columns: 1fr; } }
    .pathfield label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    .pathfield .inputwrap { display: flex; gap: 8px; }
    .pathfield input {
      flex: 1; width: 100%;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 9px 10px; font-size: 14px;
    }
    .pathfield input.dropover { border-color: var(--accent); background: #232a3a; }
    .browseBtn {
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .browseBtn:hover { background: #2a3040; }

    .wrap { display: grid; grid-template-columns: 380px 1fr; gap: 18px; padding: 18px 24px; align-items: start; max-width: 1280px; margin: 0 auto; }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    .field input[type=number], .field select {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 8px 10px; font-size: 14px;
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
    .btn {
      width: 100%; border: none; border-radius: 8px; padding: 11px 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #fff;
    }
    .btn:hover { background: var(--accent-2); }
    .btn:disabled { background: #2a2f3a; color: var(--muted); cursor: not-allowed; }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn.secondary:hover { background: #2a3040; }
    .status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 18px; white-space: pre-wrap; word-break: break-all; }
    .status.ok { color: #7bdc8b; }
    .status.err { color: #ff7b7b; }
    .export-block {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 12px 2px;
      margin-bottom: 14px;
    }
    .export-title { font-size: 15px; font-weight: 700; color: var(--text); text-align: center; margin: 0 0 12px; }
    .hintline { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .hint { display: block; width: 100%; color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* 多图集结果区 */
    .result-area { display: flex; flex-direction: column; gap: 12px; }
    .result-summary { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .result-summary b { color: var(--text); }
    .atlas-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .atlas-card summary {
      padding: 12px 16px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px;
      font-size: 14px; user-select: none;
    }
    .atlas-card summary::-webkit-details-marker { display: none; }
    .atlas-card summary:hover { background: var(--panel-2); }
    .atlas-card summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
    .atlas-card[open] summary::before { transform: rotate(90deg); }
    .ok-dot { color: #7bdc8b; font-weight: 700; }
    .fail-dot { color: #ff7b7b; font-weight: 700; }
    .meta-tag {
      background: var(--panel-2); color: var(--muted); font-size: 12px;
      padding: 2px 10px; border-radius: 20px;
    }
    .err-tag { color: #ff7b7b; font-size: 13px; }
    .atlas-body { padding: 0 16px 16px; display: flex; flex-wrap: wrap; gap: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .atlas-body .page { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel-2); display: flex; flex-direction: column; }
    .atlas-body .pagecap { font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .atlas-body .page img { display: block; max-width: 512px; image-rendering: pixelated; }
    .atlas-body .empty-inner { color: var(--muted); font-size: 13px; padding: 4px 0; }
    .empty-tip { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>KTexturePacker</h1>
    <span class="subtitle">多文件夹处理</span>
    <nav>
      <a href="index.html">首页</a>
      <a href="single.html">单文件夹处理</a>
      <a href="multi.html" class="active">多文件夹处理</a>
    </nav>
  </header>

  <!-- 顶部输入区 -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="field-row">
        <div class="pathfield">
          <label>根目录（其下每个子文件夹 = 一个图集源）</label>
          <div class="inputwrap">
            <input id="rootFolder" type="text" placeholder="如 D:\textures\all" />
            <button class="browseBtn" id="browseRoot" type="button">浏览…</button>
          </div>
        </div>
        <div class="pathfield">
          <label>输出文件夹（每个子图集输出到这里，前缀 = 子文件夹名）</label>
          <div class="inputwrap">
            <input id="outputFolder" type="text" placeholder="留空则默认 = 根目录的父目录" />
            <button class="browseBtn" id="browseOutput" type="button">浏览…</button>
          </div>
        </div>
      </div>
      <div class="hintline">⚠ 只支持本地模式：请在运行服务的同一台机器（localhost）访问本页面，填写的是服务器本机磁盘路径。可直接把根目录文件夹拖到输入框自动识别。</div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="export-block">
        <div class="export-title">打包参数（作用于所有子图集）</div>
        <div class="field">
          <label>单页图集最大边长 (px)</label>
          <input id="maxSize" type="number" value="2048" min="64" step="64" />
        </div>
        <div class="field">
          <label>留白 (px)</label>
          <input id="padding" type="number" value="1" min="0" step="1" />
        </div>
        <div class="field">
          <label>算法</label>
          <select id="algorithm">
            <option value="best">Best Short Side Fit</option>
            <option value="long">Best Long Side Fit</option>
            <option value="bottomleft">Bottom-Left</option>
            <option value="contact">Contact Point</option>
          </select>
        </div>
        <div class="field row">
          <input id="allowRotation" type="checkbox" />
          <label style="margin:0">允许 90° 顺时针 旋转（更高填充率）</label>
        </div>
      </div>
      <div class="export-block">
        <div class="export-title">导出设置（所有子图集统一）</div>
        <div class="field">
          <label>输出 Json文件格式</label>
          <select id="format">
            <option value="generic">通用格式（pages/regions）</option>
            <option value="pixijs">PixiJS v8（Spritesheet）</option>
          </select>
        </div>
        <div class="field">
          <label>描述文件后缀</label>
          <select id="suffix">
            <option value=".atlas.txt">.atlas.txt</option>
            <option value=".atlas.json">.atlas.json</option>
          </select>
        </div>
        <span class="hint">多文件夹模式下每个图集的名字 = 对应子文件夹名，无需手动指定。</span>
      </div>
      <button id="packBtn" class="btn">打包全部</button>
      <button id="previewBtn" class="btn secondary" style="margin-top:8px">预览全部图集</button>
      <button id="resetBtn" class="btn secondary" style="margin-top:8px">重置</button>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <div class="result-area" id="resultArea">
        <div class="result-summary" id="resultSummary">填写根目录后点击「预览全部图集」查看每个子图集的打包结果</div>
      </div>
    </div>
  </div>

  <!-- 文件夹选择器 -->
  <div id="picker" class="picker" style="display:none">
    <div class="picker-box">
      <div class="picker-head">
        <span id="pickerTitle">选择文件夹</span>
        <button type="button" id="pickerClose" class="browseBtn">关闭</button>
      </div>
      <div class="picker-bar">
        <button type="button" id="pickerUp" class="browseBtn">上一级</button>
        <span id="pickerPath" class="picker-path"></span>
      </div>
      <div id="pickerList" class="picker-list"></div>
      <div class="picker-foot">
        <button type="button" id="pickerSelect" class="btn" style="width:auto;padding:8px 18px">选择此文件夹</button>
      </div>
    </div>
  </div>

  <style>
    .picker { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .picker-box { width: min(640px, 92vw); max-height: 80vh; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; }
    .picker-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .picker-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .picker-path { color: var(--muted); font-size: 13px; word-break: break-all; }
    .picker-list { overflow-y: auto; padding: 8px; flex: 1; min-height: 200px; }
    .picker-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .picker-item:hover { background: var(--panel-2); }
    .picker-foot { padding: 12px 16px; border-top: 1px solid var(--border); text-align: right; }
  </style>

  <script>
    // ===== 多文件夹模式（本地模式）=====
    let outInitialized = false; // 输出文件夹是否已初始化过（一旦初始化，不再由代码自动修改）
    let pickerTarget = null;
    let pickerCurrent = '';

    const packBtn = document.getElementById('packBtn');
    const previewBtn = document.getElementById('previewBtn');
    const statusEl = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const resultSummary = document.getElementById('resultSummary');

    function status(msg, cls) { statusEl.textContent = msg; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 格式 ↔ 后缀 联动
    const formatDefaultSuffix = { generic: '.atlas.txt', pixijs: '.atlas.json' };
    let suffixTouched = false;
    document.getElementById('suffix').addEventListener('change', () => { suffixTouched = true; });
    document.getElementById('format').addEventListener('change', () => {
      if (!suffixTouched) document.getElementById('suffix').value = formatDefaultSuffix[document.getElementById('format').value] || '.atlas.txt';
      if (document.getElementById('rootFolder').value.trim()) doPreview(true);
    });

    // ===== 本地路径工具 =====
    function baseName(p) {
      const norm = p.replace(/\\/g, '/');
      const i = norm.lastIndexOf('/');
      if (i >= 0 && i < p.length - 1) return p.slice(i + 1);
      return p;
    }
    function normalizeNativePath(p) {
      if (p.startsWith('/') && /^[A-Za-z]:/.test(p.slice(1))) return p.slice(1);
      return p;
    }
    function pathDir(p) {
      const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
      return i > 0 ? p.slice(0, i) : p;
    }
    function isCompletePath(p) {
      if (!p) return false;
      return /^[A-Za-z]:[\\/]/.test(p) || /^\\\\/.test(p);
    }
    function autoInitOutputFolder(srcPath) {
      if (outInitialized) return;
      const parent = pathDir((srcPath || '').trim());
      if (!parent) return;
      document.getElementById('outputFolder').value = parent;
      outInitialized = true;
    }

    // 拖拽识别目录
    function bindDropFolder(inputEl) {
      inputEl.addEventListener('dragover', e => { e.preventDefault(); inputEl.classList.add('dropover'); });
      inputEl.addEventListener('dragleave', e => { e.preventDefault(); inputEl.classList.remove('dropover'); });
      inputEl.addEventListener('drop', e => {
        e.preventDefault();
        inputEl.classList.remove('dropover');
        const files = e.dataTransfer.files;
        const items = e.dataTransfer.items;
        let dirPath = '';
        let rawDetail = '';
        if (files && files.length && files[0].path) {
          const d = pathDir(files[0].path);
          if (isCompletePath(d)) dirPath = d; else rawDetail = files[0].path;
        }
        if (!dirPath && items && items.length && items[0].webkitGetAsEntry) {
          const en = items[0].webkitGetAsEntry();
          if (en && en.fullPath) {
            const d = pathDir(normalizeNativePath(en.fullPath));
            if (isCompletePath(d)) dirPath = d; else if (!rawDetail) rawDetail = en.fullPath;
          }
        }
        if (dirPath) {
          inputEl.value = dirPath;
          if (inputEl.id === 'rootFolder') { autoInitOutputFolder(dirPath); status('', ''); }
        } else {
          const got = rawDetail ? '（得到的是不完整路径：' + rawDetail + '）' : '（浏览器出于安全限制不提供完整本地路径）';
          status('拖拽无法获取完整文件夹路径' + got + '\n已打开文件夹选择器，请从中选择。', '');
          openPicker(inputEl);
        }
      });
    }

    [['rootFolder', 'browseRoot'], ['outputFolder', 'browseOutput']].forEach(([inp, btn]) => {
      const inputEl = document.getElementById(inp);
      bindDropFolder(inputEl);
      document.getElementById(btn).onclick = () => openPicker(inputEl);
    });

    // 文件夹选择器
    const picker = document.getElementById('picker');
    document.getElementById('pickerClose').onclick = () => picker.style.display = 'none';
    document.getElementById('pickerSelect').onclick = () => {
      if (pickerTarget) {
        pickerTarget.value = pickerCurrent || '';
        if (pickerTarget.id === 'rootFolder') autoInitOutputFolder(pickerCurrent);
      }
      picker.style.display = 'none';
    };
    document.getElementById('pickerUp').onclick = () => loadDirs(pickerParent);
    let pickerParent = '';
    async function loadDirs(path) {
      const res = await fetch('/api/dirs?path=' + encodeURIComponent(path || ''));
      if (!res.ok) { status('读取目录失败: ' + (await res.text()), 'err'); return; }
      const data = await res.json();
      pickerCurrent = data.current;
      pickerParent = data.parent;
      document.getElementById('pickerPath').textContent = pickerCurrent || '（计算机根目录）';
      const list = document.getElementById('pickerList');
      list.innerHTML = '';
      (data.dirs || []).forEach(d => {
        const div = document.createElement('div');
        div.className = 'picker-item';
        div.textContent = baseName(d) || d;
        div.onclick = () => loadDirs(d);
        list.appendChild(div);
      });
      picker.style.display = 'flex';
    }
    function openPicker(inputEl) {
      pickerTarget = inputEl;
      loadDirs(pickerCurrent || '');
    }

    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => e.preventDefault());

    function refreshButtons() {
      const ready = document.getElementById('rootFolder').value.trim().length > 0;
      packBtn.disabled = !ready;
      previewBtn.disabled = !ready;
    }
    document.getElementById('outputFolder').addEventListener('input', () => { outInitialized = true; });
    document.getElementById('rootFolder').addEventListener('input', e => { autoInitOutputFolder(e.target.value); refreshButtons(); });

    // 重置
    document.getElementById('resetBtn').onclick = () => {
      document.getElementById('rootFolder').value = '';
      document.getElementById('outputFolder').value = '';
      document.getElementById('maxSize').value = 2048;
      document.getElementById('padding').value = 1;
      document.getElementById('algorithm').value = 'best';
      document.getElementById('format').value = 'generic';
      document.getElementById('suffix').value = '.atlas.txt';
      suffixTouched = false;
      document.getElementById('allowRotation').checked = false;
      outInitialized = false;
      resultArea.innerHTML = '<div class="result-summary">填写根目录后点击「预览全部图集」查看每个子图集的打包结果</div>';
      status('', '');
      refreshButtons();
    };

    // ===== 预览：每个子图集一个折叠卡片 =====
    async function showMultiPreview(res) {
      const j = await res.json();
      const items = j.items || [];
      resultArea.innerHTML = '';
      if (!items.length) {
        resultArea.innerHTML = '<div class="empty-tip">根目录下没有子文件夹</div>';
        resultSummary.innerHTML = '根目录下没有子文件夹';
        return;
      }
      items.forEach((it, i) => {
        const det = document.createElement('details');
        det.className = 'atlas-card';
        if (i === 0) det.open = true;
        const sum = document.createElement('summary');
        if (it.error) {
          sum.innerHTML = '<span class="fail-dot">✗</span> ' + esc(it.name) +
            ' <span class="err-tag">' + esc(it.error) + '</span>';
        } else {
          const np = (it.pages || []).length;
          sum.innerHTML = '<span class="ok-dot">✓</span> ' + esc(it.name) +
            ' <span class="meta-tag">' + np + ' 页</span>' +
            ' <span class="meta-tag">' + it.count + ' 张图</span>';
        }
        det.appendChild(sum);
        if (!it.error) {
          const body = document.createElement('div');
          body.className = 'atlas-body';
          const pages = it.pages || [];
          if (!pages.length) {
            body.innerHTML = '<div class="empty-inner">（无预览图）</div>';
          }
          pages.forEach(pg => {
            const wrap = document.createElement('div');
            wrap.className = 'page';
            const cap = document.createElement('div');
            cap.className = 'pagecap';
            cap.innerHTML = '第 ' + pg.page + ' 页 · 预览 ' + pg.w + '×' + pg.h + ' · 实际 <b>' + pg.realW + '×' + pg.realH + '</b>';
            const img = document.createElement('img');
            img.src = 'data:image/png;base64,' + pg.png;
            wrap.appendChild(cap);
            wrap.appendChild(img);
            body.appendChild(wrap);
          });
          det.appendChild(body);
        }
        resultArea.appendChild(det);
      });
      let txt = '共 <b>' + j.okCount + '</b> 个子图集成功';
      if (j.failCount > 0) txt += '，<b style="color:#ff7b7b">' + j.failCount + '</b> 个失败';
      txt += ' · 图集页合计 <b>' + j.totalPages + '</b> 页 · 已放置 <b>' + j.totalSprites + '</b> 张';
      if (j.totalUnplaced > 0) txt += ' · <span style="color:#ffb86b">' + j.totalUnplaced + ' 张放不下（调大最大边长或允许旋转）</span>';
      resultSummary.innerHTML = txt;
    }

    async function doPreview(silent) {
      const root = document.getElementById('rootFolder').value.trim();
      if (!root) return;
      if (!silent) { previewBtn.disabled = true; status('预览生成中…', ''); }
      try {
        const p = new URLSearchParams({ rootFolder: root, outputFolder: document.getElementById('outputFolder').value.trim(),
          maxSize: document.getElementById('maxSize').value, padding: document.getElementById('padding').value,
          algorithm: document.getElementById('algorithm').value, allowRotation: document.getElementById('allowRotation').checked });
        p.append('_', Date.now().toString());
        const res = await fetch('/api/multi-preview?' + p.toString());
        if (!res.ok) { if (!silent) status('预览失败：' + (await res.text()), 'err'); return; }
        await showMultiPreview(res);
        if (!silent) status('预览已生成（未写入磁盘）。', 'ok');
      } catch (e) { if (!silent) status('错误：' + e.message, 'err'); }
      finally { if (!silent) previewBtn.disabled = false; }
    }
    previewBtn.onclick = () => doPreview(false);
    document.getElementById('algorithm').addEventListener('change', () => {
      if (document.getElementById('rootFolder').value.trim()) doPreview(true);
    });

    // ===== 打包全部 =====
    packBtn.onclick = async () => {
      const root = document.getElementById('rootFolder').value.trim();
      const out = document.getElementById('outputFolder').value.trim();
      if (!root) return;
      if (!out) { status('请填写输出文件夹。', 'err'); return; }
      packBtn.disabled = true; status('打包中…', '');
      try {
        const p = new URLSearchParams({ rootFolder: root, outputFolder: out, maxSize: document.getElementById('maxSize').value,
          padding: document.getElementById('padding').value, algorithm: document.getElementById('algorithm').value,
          allowRotation: document.getElementById('allowRotation').checked,
          format: document.getElementById('format').value, suffix: document.getElementById('suffix').value });
        const res = await fetch('/api/multi-pack?' + p.toString());
        const txt = await res.text();
        if (!res.ok) status('失败：' + txt, 'err');
        else {
          status('打包完成，已写入磁盘。\n' + txt, 'ok');
          doPreview(true);
        }
      } catch (e) { status('错误：' + e.message, 'err'); }
      finally { packBtn.disabled = false; }
    };

    refreshButtons();
  </script>
</body>
</html>
